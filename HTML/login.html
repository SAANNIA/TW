<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="../CSS/login_style.css" />
  </head>
  <body>
    <main class="login-page">
      <section class="login-card">
        <h1>Autentificare</h1>

        <form class="login-form" action="#" method="post">
          <div class="field">
            <label for="login-email">Email</label>
            <input id="login-email" type="email" placeholder="nume@exemplu.com" required />
          </div>

          <div class="field">
            <label for="login-password">Parolă</label>
            <input id="login-password" type="password" placeholder="Introdu parola" required />
          </div>

          <button type="submit" class="btn primary">Autentificare</button>

          <p class="helper-text">
            Nu ai cont?
            <a href="register.html">Creează unul acum</a>
          </p>
        </form>
      </section>
    </main>
  </body>
</html>
