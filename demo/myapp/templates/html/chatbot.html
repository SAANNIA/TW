<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'CSS/chatbot_style.css' %}" />
  </head>
  <body>
    <nav class="chat-nav">
      <a href="{% url 'home' %}">&larr; Acasă</a>
      <a href="{% url 'universities' %}">Universități</a>
      <a href="{% url 'galerie' %}">Galerie</a>
      <a href="{% url 'login' %}">Login</a>
    </nav>

    <div class="chat-container" id="chat-container"></div>

    <form id="chat-form">
      <input type="text" id="user-input" placeholder="Scrie un mesaj..." />
      <button type="submit">Trimite</button>
    </form>

    <script src="{% static 'JS/chatbot_js.js' %}"></script>
  </body>
</html>
