<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universități din România</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'CSS/universities_style.css' %}" />
  </head>
  <body>
    <nav class="page-nav" aria-label="Navigare">
      <a href="{% url 'home' %}">&larr; Acasă</a>
      <a href="{% url 'chatbot' %}">ChatBot</a>
      <a href="{% url 'galerie' %}">Galerie</a>
      <a href="{% url 'books' %}">Cărți</a>
      <a href="{% url 'login' %}">Login</a>
    </nav>

    <div>
      <h1>Universități din România</h1>

      <label for="q">Filtru (opțional):</label>
      <input id="q" placeholder="caută după nume..." />
      <button id="exportBtn" type="button">Export CSV</button>

      <div id="status" class="status"></div>

      <table>
        <thead>
          <tr>
            <th>Nume</th>
            <th>Țara</th>
            <th>Site</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <script src="{% static 'JS/universities_js.js' %}"></script>
  </body>
</html>
